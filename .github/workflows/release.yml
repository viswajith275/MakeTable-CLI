name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
            output_dir: dist/linux
          - target: macos-aarch64
            os: macos-latest
            output_dir: dist/macos
          - target: windows-x86_64
            os: windows-latest
            output_dir: dist/windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Install Linux Nuitka build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache

      - name: Build compressed Linux binary
        if: runner.os == 'Linux'
        run: |
          uv run python -m nuitka \
            --onefile \
            --include-package=maketable \
            --include-package=pydantic \
            --include-package=pydantic_core \
            --include-package=textual \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=scipy \
            --nofollow-import-to=pytest \
            --nofollow-import-to=unittest \
            --nofollow-import-to=ortools.linear_solver \
            --nofollow-import-to=ortools.constraint_solver \
            --nofollow-import-to=ortools.graph \
            --nofollow-import-to=ortools.algorithms \
            --nofollow-import-to=ortools.math_opt \
            --nofollow-import-to=ortools.pdlp \
            --nofollow-import-to=ortools.scheduling \
            --assume-yes-for-downloads \
            --output-dir=dist/linux \
            --output-filename=timetable \
            --lto=yes \
            --onefile-cache-mode=cached \
            --onefile-tempdir-spec="{CACHE_DIR}/timetable_app" \
            --remove-output \
            src/main.py

      - name: Build compressed macOS binary
        if: runner.os == 'macOS'
        run: |
          uv run python -m nuitka \
            --onefile \
            --include-package=maketable \
            --include-package=pydantic \
            --include-package=pydantic_core \
            --include-package=textual \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=scipy \
            --nofollow-import-to=pytest \
            --nofollow-import-to=unittest \
            --nofollow-import-to=ortools.linear_solver \
            --nofollow-import-to=ortools.constraint_solver \
            --nofollow-import-to=ortools.graph \
            --nofollow-import-to=ortools.algorithms \
            --nofollow-import-to=ortools.math_opt \
            --nofollow-import-to=ortools.pdlp \
            --nofollow-import-to=ortools.scheduling \
            --assume-yes-for-downloads \
            --output-dir=dist/macos \
            --output-filename=timetable \
            --lto=yes \
            --clang \
            --onefile-cache-mode=cached \
            --onefile-tempdir-spec="{CACHE_DIR}/timetable_app" \
            --disable-cache=ccache \
            --remove-output \
            src/main.py

      - name: Build compressed Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run python -m nuitka `
            --onefile `
            --include-package=maketable `
            --include-package=pydantic `
            --include-package=pydantic_core `
            --include-package=textual `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=scipy `
            --nofollow-import-to=pytest `
            --nofollow-import-to=unittest `
            --nofollow-import-to=ortools.linear_solver `
            --nofollow-import-to=ortools.constraint_solver `
            --nofollow-import-to=ortools.graph `
            --nofollow-import-to=ortools.algorithms `
            --nofollow-import-to=ortools.math_opt `
            --nofollow-import-to=ortools.pdlp `
            --nofollow-import-to=ortools.scheduling `
            --assume-yes-for-downloads `
            --output-dir=dist/windows `
            --output-filename=timetable.exe `
            --msvc=latest `
            --lto=yes `
            --windows-console-mode=force `
            --onefile-cache-mode=cached `
            --onefile-tempdir-spec="{CACHE_DIR}\timetable_app" `
            --remove-output `
            src/main.py

      - name: Smoke test binary
        if: runner.os != 'Windows'
        run: |
          "./${{ matrix.output_dir }}/timetable" --help
          "./${{ matrix.output_dir }}/timetable" validate test_json.json
          "./${{ matrix.output_dir }}/timetable" generate test_json.json --fast -w 1 -f json >/dev/null

      - name: Smoke test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "${{ matrix.output_dir }}/timetable.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe validate test_json.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe generate test_json.json --fast -w 1 -f json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package compressed release archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-assets
          archive_name="timetable-${{ matrix.target }}.tar.gz"
          tar -C "${{ matrix.output_dir }}" -czf "release-assets/${archive_name}" timetable
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release-assets && sha256sum "${archive_name}" > "${archive_name}.sha256")
          else
            (cd release-assets && shasum -a 256 "${archive_name}" > "${archive_name}.sha256")
          fi

      - name: Package compressed Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $archiveName = "timetable-${{ matrix.target }}.zip"
          $archivePath = "release-assets/$archiveName"
          Compress-Archive -Path "${{ matrix.output_dir }}/timetable.exe" -DestinationPath $archivePath -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$archivePath.sha256", "$hash  $archiveName`n", [System.Text.UTF8Encoding]::new($false))

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetable-${{ matrix.target }}
          path: release-assets/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
