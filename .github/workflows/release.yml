name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
            output_dir: dist/linux
          - target: macos-aarch64
            os: macos-latest
            output_dir: dist/macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Install Linux Nuitka build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache

      - name: Build compressed Linux binary
        if: runner.os == 'Linux'
        run: |
          uv run python -m nuitka \
            --onefile \
            --include-package=maketable \
            --include-package=pydantic \
            --include-package=pydantic_core \
            --include-package=textual \
            --assume-yes-for-downloads \
            --output-dir=dist/linux \
            --output-filename=timetable \
            --lto=yes \
            --onefile-cache-mode=cached \
            --onefile-tempdir-spec="{CACHE_DIR}/timetable_app" \
            --remove-output \
            src/main.py

      - name: Build compressed macOS binary
        if: runner.os == 'macOS'
        run: |
          uv run python -m nuitka \
            --onefile \
            --include-package=maketable \
            --include-package=pydantic \
            --include-package=pydantic_core \
            --include-package=textual \
            --assume-yes-for-downloads \
            --output-dir=dist/macos \
            --output-filename=timetable \
            --lto=yes \
            --clang \
            --onefile-cache-mode=cached \
            --onefile-tempdir-spec="{CACHE_DIR}/timetable_app" \
            --disable-cache=ccache \
            --remove-output \
            src/main.py

      - name: Smoke test binary
        run: |
          "./${{ matrix.output_dir }}/timetable" --help
          "./${{ matrix.output_dir }}/timetable" validate test_json.json
          "./${{ matrix.output_dir }}/timetable" generate test_json.json --fast -w 1 -f json >/dev/null

      - name: Package compressed release archive
        run: |
          mkdir -p release-assets
          archive_name="timetable-${{ matrix.target }}.tar.gz"
          tar -C "${{ matrix.output_dir }}" -czf "release-assets/${archive_name}" timetable
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release-assets && sha256sum "${archive_name}" > "${archive_name}.sha256")
          else
            (cd release-assets && shasum -a 256 "${archive_name}" > "${archive_name}.sha256")
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetable-${{ matrix.target }}
          path: release-assets/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
